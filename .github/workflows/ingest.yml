name: Ingesta programada

# Cada día ejecuta los datasets vencidos según su propia frecuencia (ops.due_datasets), con el rol
# ingest_writer. Configuración: la misma que el despliegue (scripts/supabase-config.mjs), o un
# secreto INGEST_DATABASE_URL explícito. Variable opcional: ODI_CONTACT (contacto del User-Agent).
# Sin configuración, el workflow termina sin hacer nada.

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      dataset:
        description: 'Dataset concreto (vacío = todos los vencidos)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ODI_CONTACT: ${{ vars.ODI_CONTACT }}
      DATASET: ${{ inputs.dataset }}
    steps:
      - name: ¿Hay base configurada?
        id: cfg
        env:
          HAS_CFG: ${{ secrets.INGEST_DATABASE_URL != '' || (secrets.INGEST_WRITER_PASSWORD != '' && ((secrets.SUPABASE_ACCESS_TOKEN != '' && secrets.SUPABASE_DB_PASSWORD != '') || secrets.SUPABASE_DB_URL != '')) }}
        run: |
          if [ "$HAS_CFG" != "true" ]; then
            echo "::notice title=Ingesta omitida::Faltan los secretos de Supabase o INGEST_WRITER_PASSWORD"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.skip == 'false'
      - uses: pnpm/action-setup@v4
        if: steps.cfg.outputs.skip == 'false'
      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.skip == 'false'
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.cfg.outputs.skip == 'false'
      - name: Conexión del rol de ingesta
        if: steps.cfg.outputs.skip == 'false'
        env:
          EXPLICIT_URL: ${{ secrets.INGEST_DATABASE_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          INGEST_WRITER_PASSWORD: ${{ secrets.INGEST_WRITER_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          if [ -n "$EXPLICIT_URL" ]; then
            echo "DATABASE_URL=$EXPLICIT_URL" >> "$GITHUB_ENV"
          else
            node scripts/supabase-config.mjs --ingest
          fi
      - name: Ingesta
        if: steps.cfg.outputs.skip == 'false'
        run: |
          mkdir -p out
          set +e
          if [ -n "$DATASET" ]; then pnpm --silent ingest run "$DATASET" > out/result.json 2> out/log.jsonl
          else pnpm --silent ingest due > out/result.json 2> out/log.jsonl; fi
          code=$?
          set -e
          summary=$(node -e '
            const text = require("fs").readFileSync("out/result.json", "utf8").trim();
            if (!text) { console.log("ningún dataset vencido"); process.exit(0); }
            const docs = text.split(/\n(?=\{)/).map((t) => JSON.parse(t));
            for (const o of docs) {
              const r = o.run ?? {};
              console.log(`${o.datasetCode} ${o.status}: nuevas ${r.records_inserted ?? 0}, modificadas ${r.records_updated ?? 0}, iguales ${r.records_unchanged ?? 0}, rechazadas ${r.records_rejected ?? 0}${o.reason ? " — " + o.reason : ""}`);
            }' | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
          if [ "$code" = "0" ]; then echo "::notice title=Ingesta::$summary"
          elif [ "$code" = "2" ]; then echo "::warning title=Ingesta parcial::$summary"
          else echo "::error title=Ingesta fallida::$summary"; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always() && steps.cfg.outputs.skip == 'false'
        with:
          name: ingest-${{ github.run_id }}
          path: out/
          retention-days: 30
